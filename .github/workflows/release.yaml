name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Initialize pinned dependencies and tools
        run: make setup

      - name: Check Python tooling
        run: make check-tools

      # Use the pushed tag, or a timestamp for a manual release.
      - name: Determine tag name
        id: tag
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          else
            TAG="date_$(date +'%Y%m%d%H%M%S')"
            echo "tag=$TAG" >> $GITHUB_OUTPUT
          fi

      - name: Build
        shell: bash
        run: |
          chmod +x ./scripts/github-build.sh
          ./scripts/github-build.sh

      - name: Create Release & Upload dist files
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          files: |
            dist/zuoya_gmk70_release.*
            dist/zuoya_gmk70_debug.*
