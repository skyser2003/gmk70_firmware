name: Firmware
run-name: Firmware — ${{ github.ref_name }}

on:
  push:
    branches: [main, release/via, release/vial]
    tags: ["via-v*", "vial-*"]
  pull_request:
    branches: [main, release/via, release/vial]
  workflow_dispatch:
    inputs:
      family:
        description: Firmware family (release branches select their own family)
        type: choice
        default: all
        options: [all, via, vial]

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Select firmware family
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      family: ${{ steps.route.outputs.family }}
      variants: ${{ steps.route.outputs.variants }}
      publish: ${{ steps.route.outputs.publish }}
    steps:
      - name: Checkout project
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Route branch or tag
        id: route
        env:
          REQUESTED_FAMILY: ${{ inputs.family || 'all' }}
        run: python3 tools/build-support/github_release.py plan --family "$REQUESTED_FAMILY" >> "$GITHUB_OUTPUT"

  checks:
    name: Tests and tooling
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout project
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: System prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl xz-utils
      - name: Cache pinned tools
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .work/toolchains
            .work/uv-cache
          key: ${{ runner.os }}-gmk70-tools-${{ hashFiles('dependencies/sources.lock.json', 'scripts/setup.sh', 'tools/*/uv.lock') }}
      - name: Initialize pinned sources and tools
        run: make setup setup-vial
      - name: Native firmware and repository tests
        run: make test
      - name: Python formatting, types and tests
        run: make check-tools

  build:
    name: Build ${{ matrix.variant }}
    needs: [plan, checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.plan.outputs.variants) }}
    steps:
      - name: Checkout project
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: System prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl xz-utils
      - name: Restore pinned tools
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .work/toolchains
            .work/uv-cache
          key: ${{ runner.os }}-gmk70-tools-${{ hashFiles('dependencies/sources.lock.json', 'scripts/setup.sh', 'tools/*/uv.lock') }}
      - name: Initialize pinned sources and tools
        run: make setup
      - name: Initialize Vial sources
        if: startsWith(matrix.variant, 'vial')
        run: make setup-vial
      - name: Build and verify package
        env:
          FIRMWARE_VARIANT: ${{ matrix.variant }}
          JOBS: "2"
        run: bash scripts/github-build.sh "$FIRMWARE_VARIANT"
      - name: Upload firmware, checksums and sources
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gmk70-firmware-${{ matrix.variant }}
          path: dist/*
          if-no-files-found: error
          overwrite: true
          compression-level: 0
          retention-days: 30

  release:
    name: Publish ${{ needs.plan.outputs.family }} firmware
    needs: [plan, checks, build]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: gmk70-publish-${{ needs.plan.outputs.family }}
      cancel-in-progress: false
      queue: max
    steps:
      - name: Checkout release notes
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Download selected firmware bundles
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: gmk70-firmware-*
          merge-multiple: true
          path: dist
      - name: Verify, tag and publish this family
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FIRMWARE_FAMILY: ${{ needs.plan.outputs.family }}
        run: python3 tools/build-support/github_release.py publish --family "$FIRMWARE_FAMILY"
