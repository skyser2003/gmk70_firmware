name: Firmware

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Tests and tooling
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout project
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: System prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl xz-utils
      - name: Cache pinned tools
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .work/toolchains
            .work/uv-cache
          key: ${{ runner.os }}-gmk70-tools-${{ hashFiles('dependencies/sources.lock.json', 'scripts/setup.sh', 'tools/*/uv.lock') }}
      - name: Initialize pinned sources and tools
        run: make setup setup-vial
      - name: Native firmware and repository tests
        run: make test
      - name: Python formatting, types and tests
        run: make check-tools

  build:
    name: Build ${{ matrix.variant }}
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        variant:
          - qmk-default
          - via-release
          - via-debug
          - via-release-updater
          - via-debug-updater
          - vial
          - vial-updater
    steps:
      - name: Checkout project
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: System prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl xz-utils
      - name: Restore pinned tools
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .work/toolchains
            .work/uv-cache
          key: ${{ runner.os }}-gmk70-tools-${{ hashFiles('dependencies/sources.lock.json', 'scripts/setup.sh', 'tools/*/uv.lock') }}
      - name: Initialize pinned sources and tools
        run: make setup
      - name: Initialize Vial sources
        if: startsWith(matrix.variant, 'vial')
        run: make setup-vial
      - name: Build and verify package
        env:
          FIRMWARE_VARIANT: ${{ matrix.variant }}
          JOBS: "2"
        run: bash scripts/github-build.sh "$FIRMWARE_VARIANT"
      - name: Upload firmware, checksums and sources
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gmk70-firmware-${{ matrix.variant }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  release:
    name: Publish tagged firmware
    needs: [checks, build]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout release notes
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Download all seven firmware bundles
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: gmk70-firmware-*
          merge-multiple: true
          path: dist
      - name: Verify release assets
        shell: bash
        run: |
          cd dist
          for variant in qmk-default via-release via-debug via-release-updater via-debug-updater vial vial-updater; do
            sha256sum --check "gmk70-$variant.sha256"
          done
          cat gmk70-*.sha256 > SHA256SUMS
      - name: Upload and publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' > "$RUNNER_TEMP/release-draft"; then
            if [[ "$(cat "$RUNNER_TEMP/release-draft")" != true ]]; then
              printf 'Release %s is already published; refusing to replace its assets.\n' "$RELEASE_TAG" >&2
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "$RELEASE_TAG" --notes-file docs/RELEASE-NOTES.md --generate-notes
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false
