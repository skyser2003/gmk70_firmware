[project]
name = "gmk70-zmk-build"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "cmake==3.31.6",
  "ninja==1.11.1.4",
  "west==1.3.0",
  "pyelftools==0.32",
  "pyyaml==6.0.2",
  "pykwalify==1.8.0",
  "packaging==24.2",
  "intelhex==2.3.0",
  "protobuf==6.32.1",
  "grpcio-tools==1.76.0",
]

[dependency-groups]
dev = ["mypy==1.15.0", "ruff==0.11.2"]

[tool.mypy]
strict = true

[tool.ruff]
target-version = "py312"
