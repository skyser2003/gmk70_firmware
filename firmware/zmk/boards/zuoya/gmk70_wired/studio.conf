# Unlocked universal image; PB9 selects LEFT central or RIGHT peripheral.
CONFIG_USB_DEVICE_PRODUCT="GMK70 ZMK Studio"
CONFIG_ZMK_KEYBOARD_NAME="GMK70 ZMK Studio"
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_ZMK_HID_INDICATORS=y
# Match QMK: keep RGB during idle; the board sleep coordinator blanks both halves.
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=n
# Board policy selects the saved timeout; native PM retries at its minimum.
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=60000
# Native Zephyr -Oz; preserve the fixed stack and application reservations.
CONFIG_SIZE_OPTIMIZATIONS_AGGRESSIVE=y
# Settings/Studio only require integer and string formatting in this build.
CONFIG_CBPRINTF_NANO=y
CONFIG_CBPRINTF_REDUCED_INTEGRAL=y
# All application deadlines are relative and at most 30 minutes. Uptime remains
# 64-bit; 32-bit relative kernel timeouts avoid unused absolute-deadline support.
CONFIG_TIMEOUT_64BIT=n
# Scanner and application work use millisecond deadlines. Hardware UART, LED
# and USB timing retains cycle counters/busy waits independent of kernel ticks.
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000
CONFIG_USB_DEVICE_REMOTE_WAKEUP=y
# Native pointing callbacks use existing workers; do not reserve an input thread.
CONFIG_ZMK_POINTING=y
CONFIG_INPUT_MODE_SYNCHRONOUS=y
CONFIG_PM_DEVICE=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_CUSTOM=y
CONFIG_GMK70_ZMK_STUDIO_SETTINGS=y
# Send the right half's pixels over the native wired lighting transaction.
CONFIG_GMK70_RGB_LOCAL_ONLY=n
CONFIG_GMK70_BATTERY=y
CONFIG_GMK70_RADIO=y
CONFIG_GMK70_FUNCTION_FLIP=y
CONFIG_ZMK_BATTERY_REPORTING_FETCH_MODE_STATE_OF_CHARGE=y
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=3
CONFIG_USB_CDC_ACM=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=y
# Keep the downstream RPC ring large enough for an entire CDC burst,
# including framed/escaped layer names and maximum-width request IDs.
CONFIG_ZMK_STUDIO_RPC_RX_BUF_SIZE=128
CONFIG_USB_CDC_ACM_RINGBUF_SIZE=128
CONFIG_USB_REQUEST_BUFFER_SIZE=128
CONFIG_USB_HID_DEVICE_COUNT=1
CONFIG_ENABLE_HID_INT_OUT_EP=n

# USB-only RPC stack; recheck compiled stack budget before hardware validation.
CONFIG_ZMK_STUDIO_RPC_THREAD_STACK_SIZE=2560
# Main only performs initialization/settings load and then returns. Native
# flash work runs on the separate 2048-byte updater stack. Compiled stack
# usage is reviewed with this budget; hardware watermarks remain required.
CONFIG_MAIN_STACK_SIZE=1024
