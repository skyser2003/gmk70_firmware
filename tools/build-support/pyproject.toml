[project]
name = "gmk70-build-support"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "qmk>=1.1.0",
    "argcomplete",
    "colorama",
    "dotty-dict",
    "hjson",
    "jsonschema>=4",
    "milc>=1.9.0",
    "pygments",
    "pyserial",
    "pyusb",
    "pillow",
]

[dependency-groups]
dev = ["mypy", "ruff", "clang-format"]

[tool.mypy]
strict = true

[tool.ruff]
target-version = "py312"
